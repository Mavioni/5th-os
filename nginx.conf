# 5th OS nginx config — serves at /5th-os/ base path matching vite base
server {
    listen 80;
    server_name _;

    # Root is where the built assets live
    root /usr/share/nginx/html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # SPA routing: serve index.html for all /5th-os/* paths
    location /5th-os/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /5th-os/index.html;
        index index.html;
    }

    # Redirect root to /5th-os/
    location = / {
        return 301 /5th-os/;
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 256;
}
