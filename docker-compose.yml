# ================================================================
# 5TH OS — DOCKER COMPOSE
# Dev: hot-reload workspace (npm run dev)
# Prod: nginx serving built assets
# ================================================================

services:

  # ---- DEV WORKSPACE (default) ----------------------------------
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lelu-os-dev
    ports:
      - "3000:3000"
    volumes:
      # Mount source for hot-reload (exclude node_modules from mount)
      - .:/workspace
      - /workspace/node_modules   # anonymous volume preserves container's node_modules
      - /workspace/dist           # anonymous volume for build output
    environment:
      - NODE_ENV=development
      - VITE_HOST=0.0.0.0
    stdin_open: true
    tty: true
    command: npx vite --host 0.0.0.0 --port 3000
    restart: unless-stopped

  # ---- PRODUCTION -----------------------------------------------
  prod:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: lelu-os-prod
    ports:
      - "8080:80"
    restart: unless-stopped
    profiles:
      - prod

  # ---- PRODUCTION with HTTPS (requires certs) -------------------
  prod-ssl:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: lelu-os-prod-ssl
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./certs:/etc/nginx/certs:ro
    restart: unless-stopped
    profiles:
      - prod-ssl
