# ================================================================
# 5TH OS — DOCKER COMPOSE
# Linux Mint Cinnamon fork + hacking toolkit
# Auto-tracks Cinnamon releases via daily apt updates
# ================================================================

services:

  # ---- FULL CINNAMON DESKTOP -------------------------------------
  desktop:
    build:
      context: .
      dockerfile: Dockerfile.os
    container_name: lelu-os-desktop
    ports:
      - "6080:6080"    # noVNC browser desktop
      - "5901:5901"    # VNC direct
      - "8080:8080"    # code-server
    volumes:
      - lelu-home:/root
      - lelu-cinnamon:/root/.cinnamon
    environment:
      - RESOLUTION=1920x1080
      - VNC_PW=revenant
      - TZ=UTC
    shm_size: "2gb"
    stdin_open: true
    tty: true
    restart: unless-stopped

volumes:
  lelu-home:
  lelu-cinnamon:
